site_name: claudectl
site_description: >-
  The workspace layer for Claude Code — persistent project memory, an interactive
  architecture graph, MCP server management, and per-project launch control, in a fast
  terminal UI or a native desktop GUI. Zero runtime dependencies.
site_url: https://babarmuhammad.github.io/claudectl/
site_author: Babar Muhammad Anas
repo_url: https://github.com/babarmuhammad/claudectl
repo_name: babarmuhammad/claudectl
edit_uri: edit/main/docs/
copyright: MIT licensed — Copyright &copy; 2026 Babar Muhammad Anas

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  # docs/img holds only tool-generated screenshots (test_demo_fixtures guards
  # that); brand assets live in docs/assets.
  favicon: assets/favicon.ico
  # No Google Fonts fetch — the GUI itself ships zero CDN requests, and the site
  # holds the same line.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # README.md and CHANGELOG.md live at the repo root, one level above docs_dir.
      # check_paths makes a moved/renamed source a build failure instead of a
      # silently empty page.
      base_path: ['.']
      check_paths: true
  - toc:
      permalink: true

# Grouped into sections (navigation.sections is on above) rather than a flat list:
# the README used to be the manual and the site a set of include-stubs, so twelve
# flat entries were enough. Now the detail lives here, and a reader has to be able
# to find one feature without scrolling one giant page.
nav:
  - Getting started:
      - Home: index.md
      - Install: install.md
      - Usage: usage.md
  - Features:
      - Overview: features.md
      - Sessions & search: sessions.md
      - Project memory: memory.md
      - Architecture graph: graph.md
      - Model providers: providers.md
      - Plan → Execute & OmniRoute: plan-execute.md
      - Multiple accounts: accounts.md
      - Context hand-off: context-handoff.md
      - MCP servers: mcp.md
      - Agents & skills: agents.md
      - Hooks: hooks.md
      - Status line, failover & checkpoints: statusline.md
      - Desktop GUI: gui.md
  - Guides:
      - Token economy: token-economy.md
      - Project health & auto-fixes: health.md
      - Installing the agent library: agent-library.md
  - Reference:
      - Files, layout & encoding: reference.md
      - API reference: api.md
  - About:
      - FAQ: faq.md
      - Compare: compare.md
      - Troubleshooting: troubleshooting.md
      - Changelog: changelog.md
      - Credits: credits.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/babarmuhammad/claudectl
      name: claudectl on GitHub
