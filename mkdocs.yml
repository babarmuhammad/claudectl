site_name: claudectl
site_description: >-
  The workspace layer for Claude Code — persistent project memory, an interactive
  architecture graph, MCP server management, and per-project launch control, in a fast
  terminal UI or a native desktop GUI. Zero runtime dependencies.
# Canonical host. The manual lives on its own subdomain; the apex is the marketing
# site and is a different deployment entirely. The site is built by Vercel and
# mirrored on GitHub Pages; both copies emit this URL, so search and answer engines
# index one of them rather than splitting the same content across two domains.
# Asset and page links stay relative, which is why one site_url serves both.
site_url: https://docs.claudectl.space/
site_author: Babar Muhammad Anas
repo_url: https://github.com/babarmuhammad/claudectl
repo_name: babarmuhammad/claudectl
edit_uri: edit/main/docs/
copyright: MIT licensed — Copyright &copy; 2026 Babar Muhammad Anas

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  # docs/img holds only tool-generated screenshots (test_demo_fixtures guards
  # that); brand assets live in docs/assets.
  favicon: assets/favicon.ico
  # No Google Fonts fetch — the GUI itself ships zero CDN requests, and the site
  # holds the same line.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

# Emits site/llms-full.txt at build time — the companion to the hand-written
# docs/llms.txt index. Generated, not committed, so it can never fall behind.
hooks:
  - tools/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # README.md and CHANGELOG.md live at the repo root, one level above docs_dir.
      # check_paths makes a moved/renamed source a build failure instead of a
      # silently empty page.
      base_path: ['.']
      check_paths: true
  - toc:
      permalink: true

# Two sections (navigation.sections is on above). The first is the manual, read
# top to bottom: what it is, how to install it, then one page per surface, then
# what things cost and what to do when they break. The second is everything you
# look something up in rather than read.
#
# The product pitch is NOT here — it belongs to the marketing site on the apex.
# features/faq/compare/credits/changelog are the last of it and are parked at the
# end of Reference until those pages exist there; moving them first would 404
# links that are already live.
nav:
  - Manual:
      - Home: index.md
      - Getting started: getting-started.md
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Command line: cli.md
      - Terminal UI: tui.md
      - Desktop app: desktop.md
      - Claude Code plugin: plugin.md
      - Configuration: configuration.md
      - Projects: projects.md
      - Sessions: sessions.md
      - Project memory: memory.md
      - Architecture graph: architecture.md
      - Usage & cost: usage.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - API reference: api.md
      - Project dashboard: dashboard.md
      - Multiple accounts: accounts.md
      - Context hand-off: context-handoff.md
      - MCP servers: mcp.md
      - Agents & skills: agents.md
      - Agent library install: agent-library.md
      - Hooks: hooks.md
      - Plan → Execute & OmniRoute: plan-execute.md
      - Status line, failover & checkpoints: statusline.md
      - Files, layout & encoding: reference.md
      # Features, FAQ, Download, Changelog and the code of conduct live on the
      # apex marketing site now — one page per URL, on one host. vercel.json
      # redirects their old docs URLs there. What stays here is what the apex
      # has no equivalent for.
      - Compare: compare.md
      - Credits: credits.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/babarmuhammad/claudectl
      name: claudectl on GitHub

  # schema.org `sameAs` for the author entity, emitted on every page by
  # overrides/main.html. An unrelated Rust project publishes under this name,
  # so what identifies THIS claudectl is one author corroborated by a set of
  # profiles that link back. Must stay in step with `PROFILES` in
  # www/lib/site.ts — both hosts have to assert the same entity or the graph
  # says there are two of them.
  author: Babar Muhammad Anas
  apex: https://claudectl.space
  profiles:
    - https://github.com/babarmuhammad
    - https://www.linkedin.com/in/muhammad-anas-babar-819647240
    - https://dev.to/muhammad_anasbabar_31256
    - https://babarmuhammad.hashnode.dev
    - https://www.instagram.com/muhammad_anas_babar
