[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claudectl"
version = "1.9.0"
description = "The workspace layer for Claude Code - persistent project memory, an interactive architecture graph, MCP awareness, and per-project launch control in a fast terminal UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Babar Muhammad Anas" }]
keywords = [
    "claude", "claude-code", "tui", "session-manager", "windows",
    "ai-agents", "context-management", "developer-tools", "mcp",
    "terminal-ui", "workspace", "session-history",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

# PyPI renders these as the sidebar links, and they are also the strongest
# machine-readable statement that this package, the site, the docs and the
# repository are one thing — which matters because an unrelated Rust project
# publishes under the same name. `Repository` is the key PyPI gives its own
# icon to; `Source` is kept because it is what the existing listing shows.
[project.urls]
Homepage = "https://claudectl.space"
Documentation = "https://docs.claudectl.space/"
Repository = "https://github.com/babarmuhammad/claudectl"
Source = "https://github.com/babarmuhammad/claudectl"
Issues = "https://github.com/babarmuhammad/claudectl/issues"
Changelog = "https://claudectl.space/changelog"

[project.scripts]
# cli:run, not main:run — main's import chain pulls urllib/ssl/http.client via
# `usage`, and `claudectl statusline` runs on every conversation turn.
claudectl = "claude_sessions.cli:run"

[project.optional-dependencies]
dev = ["pytest"]
gui = ["PyQt6", "PyQt6-WebEngine"]   # optional native desktop shell (gui_qt.py)

[tool.setuptools]
packages = ["claude_sessions"]

[tool.setuptools.package-data]
# The GUI is served from source files, not generated — they have to ship.
# web/vendor/** is three.js + anime.js (both MIT, vendored so the GUI stays
# offline); the nested globs are needed because package-data does not recurse.
claude_sessions = [
    "web/*.html", "web/*.css", "web/*.js",
    "web/vendor/*.js", "web/vendor/*.txt",
    "web/vendor/*/*.js",
    # nested: every template is skills_templates/<name>/SKILL.md, so the flat
    # glob matched nothing and the wheel shipped an empty templates directory.
    "skills_templates/*/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow, and chosen by what it actually caught on first run:
# F821 found three live NameErrors in plan_execute's step editor and one in
# review._supports_color, and B023 found two loop-variable closures. Style rules
# are excluded on purpose — 88 unused imports and 77 placeholder-less f-strings
# are a separate, mechanical diff, and bundling them here would mean the gate
# that matters lands red and gets switched off.
select = [
    "E9",     # syntax / IO errors
    "F821",   # undefined name — a NameError waiting for the branch to run
    "F811",   # redefinition of an unused name
    "F632",   # `is` against a literal
    "F702",   # continue outside a loop
    "B023",   # closure over a loop variable
    "B006",   # mutable default argument
    "B002",   # ++n is not an increment
]

[tool.pytest.ini_options]
testpaths = ["tests"]
